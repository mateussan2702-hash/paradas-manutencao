<title>R1700 Explodida</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: bancada de oficina subterrânea — visualizador 3D à esquerda, ficha técnica do sistema à direita (empilha no celular) */
:root{
  --bg:#0d1012; --panel:#14181b; --raise:#1b2024; --line:#2a3136; --fg:#e9e6de; --muted:#98a1a6;
  --accent:#f0b323; --accent-ink:#1b1504; --hot:#ff7b39; --cool:#4db6dc; --ok:#86c78f;
  --display:"Barlow Condensed","Arial Narrow",sans-serif;
  --body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:14px;line-height:1.55}
.app{height:100%;box-sizing:border-box;display:grid;grid-template-columns:minmax(0,1fr) 430px;gap:16px;
  padding-block:16px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.viewer{position:relative;min-width:0;min-height:0;border:1px solid var(--line);border-radius:10px;overflow:hidden;
  background:radial-gradient(ellipse at 50% 35%,var(--raise),var(--bg) 75%)}
.viewer canvas{display:block;width:100%;height:100%;touch-action:none;cursor:grab}
.viewer canvas.pointing{cursor:pointer}
.panel{min-width:0;overflow-y:auto;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:20px 22px 28px}

/* HUD sobre o 3D */
.hud{position:absolute;display:flex;gap:8px;align-items:center;flex-wrap:wrap;pointer-events:none}
.hud>*{pointer-events:auto}
.crumb{top:12px;left:12px;right:12px}
.crumb .path{font-family:var(--display);font-weight:600;font-size:18px;letter-spacing:.03em;text-transform:uppercase;
  background:color-mix(in srgb,var(--bg) 78%,transparent);padding:4px 10px;border-radius:6px;border:1px solid var(--line)}
.crumb .path b{color:var(--accent);font-weight:700}
.controls{left:12px;right:12px;bottom:12px}
.live{top:56px;left:12px;max-width:min(560px,calc(100% - 24px));font-family:var(--mono);font-size:12px}
.live:empty{display:none}
.live .box{background:color-mix(in srgb,var(--bg) 82%,transparent);border:1px solid var(--line);border-radius:6px;padding:8px 10px}
.btn{font-family:var(--display);font-weight:600;font-size:15px;letter-spacing:.05em;text-transform:uppercase;color:var(--fg);
  background:var(--raise);border:1px solid var(--line);border-radius:6px;padding:6px 12px;cursor:pointer;line-height:1.2}
.btn:hover{border-color:var(--muted)}
.btn:focus-visible,.tab:focus-visible,.sysbtn:focus-visible,.partbtn:focus-visible,.opt:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.slider{display:flex;align-items:center;gap:8px;background:var(--raise);border:1px solid var(--line);border-radius:6px;padding:4px 10px;
  font-family:var(--display);font-weight:600;font-size:15px;letter-spacing:.05em;text-transform:uppercase}
.slider input{accent-color:var(--accent);width:130px}
.hint{font-size:12px;color:var(--muted);margin-left:auto;background:color-mix(in srgb,var(--bg) 70%,transparent);padding:3px 8px;border-radius:4px}
.tip{position:absolute;pointer-events:none;font-family:var(--display);font-weight:600;font-size:15px;letter-spacing:.03em;
  background:var(--accent);color:var(--accent-ink);padding:2px 8px;border-radius:4px;transform:translate(12px,-130%);white-space:nowrap}
.strokes{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:4px;margin-top:6px}
.strokes div{border:1px solid var(--line);border-radius:4px;padding:3px 4px;text-align:center;font-size:11px;line-height:1.3}
.strokes .s-pow{background:color-mix(in srgb,var(--hot) 35%,transparent);border-color:var(--hot)}
.strokes .s-exh{background:color-mix(in srgb,var(--muted) 18%,transparent)}
.strokes .s-int{background:color-mix(in srgb,var(--cool) 25%,transparent);border-color:var(--cool)}
.strokes .s-cmp{background:color-mix(in srgb,var(--accent) 18%,transparent)}
.k{color:var(--accent)}

/* Painel */
.eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--accent)}
h1{font-family:var(--display);font-weight:700;font-size:34px;line-height:1.05;margin:4px 0 10px;text-wrap:balance;letter-spacing:.01em}
h2{font-family:var(--display);font-weight:600;font-size:20px;letter-spacing:.04em;text-transform:uppercase;margin:22px 0 8px}
h3{font-family:var(--display);font-weight:600;font-size:17px;letter-spacing:.03em;margin:0 0 4px}
p{margin:0 0 10px;max-width:65ch}
.lede{color:var(--fg);font-size:15px}
.muted{color:var(--muted)}
.small{font-size:12.5px}
.stack{display:flex;flex-direction:column;gap:8px}
.specs{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:13px;margin:6px 0 4px}
.specs dt{color:var(--muted)}
.specs dd{margin:0;font-family:var(--mono);font-size:12.5px;font-variant-numeric:tabular-nums}
.sysbtn{display:grid;grid-template-columns:28px 1fr;gap:2px 10px;text-align:left;width:100%;background:var(--raise);border:1px solid var(--line);
  border-radius:8px;padding:10px 12px;color:var(--fg);cursor:pointer;font:inherit}
.sysbtn:hover{border-color:var(--accent)}
.sysbtn .n{grid-row:span 2;font-family:var(--mono);color:var(--accent);font-size:12px;padding-top:3px}
.sysbtn .t{font-family:var(--display);font-weight:600;font-size:18px;letter-spacing:.02em}
.sysbtn .d{color:var(--muted);font-size:12.5px}
.back{margin-bottom:14px}
.note{font-size:12.5px;color:var(--muted);border-top:1px solid var(--line);padding-top:10px;margin-top:14px}
.tabs{display:flex;gap:4px;flex-wrap:wrap;border-bottom:1px solid var(--line);margin:16px 0 14px}
.tab{font-family:var(--display);font-weight:600;font-size:15px;letter-spacing:.05em;text-transform:uppercase;background:none;border:0;
  color:var(--muted);padding:6px 8px;cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px}
.tab[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--accent)}
.card{background:var(--raise);border:1px solid var(--line);border-radius:8px;padding:12px 14px}
.card .lab{font-family:var(--mono);font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--accent);margin-bottom:4px}
.card .mnt{margin-top:8px;padding-top:8px;border-top:1px dashed var(--line);font-size:13px}
.card .mnt b{font-family:var(--display);letter-spacing:.04em;text-transform:uppercase;font-weight:600;color:var(--ok);font-size:13px;margin-right:4px}
.partbtn{display:flex;justify-content:space-between;align-items:baseline;gap:10px;width:100%;text-align:left;background:none;border:0;
  border-bottom:1px solid var(--line);color:var(--fg);padding:8px 2px;cursor:pointer;font:inherit}
.partbtn:hover .pn,.partbtn.sel .pn{color:var(--accent)}
.partbtn .pn{font-weight:500}
.partbtn .go{font-family:var(--mono);font-size:11px;color:var(--muted)}
.flow{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:8px 0 12px;font-size:12.5px}
.flow span{background:var(--raise);border:1px solid var(--line);border-radius:4px;padding:2px 8px}
.flow i{color:var(--accent);font-style:normal}
.formula{font-family:var(--mono);font-size:12.5px;background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:10px 12px;margin:8px 0 12px;white-space:pre-wrap;overflow-x:auto}
.tblwrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:12.5px}
th{font-family:var(--display);font-weight:600;letter-spacing:.05em;text-transform:uppercase;text-align:left;color:var(--muted);font-size:13px;padding:6px 8px;border-bottom:1px solid var(--line)}
td{padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:top}
td.iv{font-family:var(--mono);font-size:12px;white-space:nowrap;color:var(--accent)}
.fail{display:grid;gap:3px;padding:10px 0;border-bottom:1px solid var(--line)}
.fail h3{color:var(--hot)}
.fail .row{font-size:13px}
.fail .row b{font-family:var(--display);font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);font-size:12.5px;margin-right:4px}
.pcm{margin-top:14px}
.pcm .lab{color:var(--ok)}
.opt{display:block;width:100%;text-align:left;background:var(--raise);border:1px solid var(--line);border-radius:6px;padding:8px 12px;color:var(--fg);cursor:pointer;font:inherit;margin-bottom:6px}
.opt.right{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 16%,var(--raise))}
.opt.wrong{border-color:var(--hot);background:color-mix(in srgb,var(--hot) 14%,var(--raise))}
.err{position:absolute;inset:0;display:grid;place-items:center;padding:24px;text-align:center;color:var(--muted)}

@media (max-width:860px){
  html,body{height:auto}
  .app{height:auto;grid-template-columns:minmax(0,1fr)}
  .viewer{height:60vh;min-height:380px}
  .panel{overflow:visible}
  .hint{display:none}
  .slider input{width:96px}
  h1{font-size:30px}
}
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}
</style>

<div class="app">
  <div class="viewer" id="viewer">
    <div class="hud crumb" id="crumb"></div>
    <div class="hud live" id="live"></div>
    <div class="hud controls" id="controls"></div>
    <div class="tip" id="tip" hidden></div>
  </div>
  <aside class="panel" id="panel" aria-live="polite"></aside>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
"use strict";
/* =========================================================
   CONTEÚDO TÉCNICO
   ========================================================= */
const NOTE_PLAN = "Intervalos típicos, para estudo. O plano oficial é o do Manual de Operação e Manutenção (OMM) da sua máquina e muda com o resultado do S·O·S, a qualidade do combustível e a severidade da aplicação.";

const SYS = {
 motor:{
  n:"Motor diesel Cat C13", tag:"Trem de força", detail:"Vista explodida do motor com o ciclo de 4 tempos animado",
  sum:"Motor de 6 cilindros em linha, cerca de 12,5 litros, turboalimentado e com pós-arrefecimento ar-ar. Transforma a energia do diesel em torque no volante, que move o conversor de torque, a transmissão e as bombas hidráulicas.",
  how:[
   "Cada cilindro trabalha em 4 tempos, que levam duas voltas do virabrequim: <b>admissão</b> (pistão desce e puxa ar), <b>compressão</b> (pistão sobe e o ar esquenta a mais de 500 °C), <b>combustão</b> (o diesel injetado se inflama sozinho pelo calor e empurra o pistão) e <b>escape</b> (pistão sobe e expulsa os gases).",
   "Com 6 cilindros, há uma combustão a cada 120° de giro. A ordem de ignição é 1-5-3-6-2-4, escolhida para equilibrar as forças ao longo do virabrequim. Na animação, o cilindro que brilha laranja está no tempo de combustão.",
   "O turbo aproveita a energia do escape para comprimir o ar de admissão. O ar comprimido esquenta, por isso passa pelo pós-arrefecedor ar-ar (ATAAC) antes de entrar no coletor. Ar mais frio é mais denso: cabe mais oxigênio no cilindro e dá para queimar mais diesel com menos fumaça.",
   "O módulo eletrônico (ECM) lê sensores de rotação, pressão de turbo, temperatura e acelerador e decide quanto e quando injetar. É também ele que reduz a potência (derate) para proteger o motor em superaquecimento ou baixa pressão de óleo."
  ],
  flow:["Ar","Filtro de ar","Turbo (compressor)","ATAAC","Coletor de admissão","Cilindros","Coletor de escape","Turbo (turbina)","Escape"],
  formula:"Ordem de ignição: 1 – 5 – 3 – 6 – 2 – 4\nIntervalo entre combustões = 720° ÷ 6 cilindros = 120°\nComando de válvulas gira a ½ da rotação do virabrequim",
  parts:{
   bloco:["Bloco do motor","Estrutura de ferro fundido com os cilindros, as galerias de óleo e de líquido de arrefecimento e os mancais do virabrequim.","Inspecione trincas e vazamentos externos. Na análise de óleo, sódio e potássio altos indicam líquido de arrefecimento entrando no óleo."],
   cabecote:["Cabeçote e válvulas","Fecha os cilindros por cima e forma a câmara de combustão. Aloja as válvulas de admissão (azuis) e de escape (vermelhas). O C13 tem 4 válvulas por cilindro; o modelo mostra 2 para ficar legível.","Junta do cabeçote danificada pressuriza o sistema de arrefecimento: perda de líquido sem vazamento visível e bolhas no tanque de expansão."],
   comando:["Comando de válvulas","Eixo com ressaltos (cames) que abre cada válvula no momento certo. Gira a metade da rotação do virabrequim, porque cada cilindro só admite e escapa uma vez a cada duas voltas.","Folga de válvulas fora da especificação causa ruído, perda de potência e queima de válvula. A regulagem segue o intervalo do OMM."],
   injetores:["Injetores","Pulverizam o diesel em pressão muito alta (acima de 1.500 bar) dentro da câmara no fim da compressão. O ECM define o início e a duração da injeção.","Injetor gotejando gera fumaça, falha de cilindro e diluição de combustível no óleo (aparece no S·O·S). O teste de corte de cilindro no software de diagnóstico isola o injetor ruim."],
   tampa:["Tampa de válvulas","Cobre o trem de válvulas e mantém o óleo que lubrifica o comando.","Use junta nova a cada abertura para regulagem."],
   pistoes:["Pistões e anéis","Recebem a força da expansão dos gases. Os anéis vedam a compressão e raspam o excesso de óleo da parede do cilindro.","Desgaste aparece como blow-by (vapor saindo pelo respiro do cárter), consumo de óleo e ferro, cromo e alumínio subindo no S·O·S."],
   bielas:["Bielas","Ligam cada pistão ao virabrequim. Transformam o vai-e-vem do pistão em rotação.","Sem pressão de óleo, a bronzina de biela funde em minutos. Alarme de baixa pressão de óleo é parada imediata."],
   virabrequim:["Virabrequim","Eixo de manivelas. Os 6 moentes ficam em pares defasados de 120° (1 e 6, 2 e 5, 3 e 4), o que dá um torque contínuo e equilibrado.","Desgaste de bronzinas aparece como chumbo, estanho e cobre no S·O·S. A folga axial é medida na reforma."],
   volante:["Volante","Disco pesado que guarda energia entre as combustões e suaviza o giro. Tem a cremalheira onde engrena o motor de partida e entrega o torque ao conversor.","Motor de partida que raspa ao engrenar indica dentes da cremalheira gastos."],
   amortecedor:["Amortecedor de vibração","Fica na frente do virabrequim e absorve a vibração de torção que poderia trincá-lo.","Amortecedor viscoso estufado, amassado ou vazando é trocado. Ele protege o virabrequim, a peça mais cara do motor."],
   turbo:["Turbocompressor","A turbina gira com os gases de escape e, no mesmo eixo, o compressor empurra mais ar para os cilindros. Passa de 80.000 rpm.","Desligar o motor sem 3 a 5 minutos de marcha lenta carboniza o óleo no mancal do turbo. Inspecione folga do eixo, vazamento de óleo e as pás."],
   coletor_adm:["Coletor de admissão","Distribui aos cilindros o ar que veio do turbo e foi resfriado no ATAAC.","Vazamento de ar depois do turbo derruba a potência e gera fumaça preta. Verifique abraçadeiras e mangueiras de pressão."],
   coletor_esc:["Coletor de escape","Recolhe os gases quentes, acima de 500 °C, e os leva até a turbina.","Trincas, juntas queimadas e isolamento térmico danificado são risco de incêndio, um ponto crítico em mina subterrânea."],
   carter:["Cárter","Reservatório do óleo lubrificante. A bomba de óleo aspira daqui e pressuriza as galerias do bloco.","Colete a amostra S·O·S sempre no mesmo ponto (válvula de amostragem) e com o motor na temperatura de trabalho."],
   filtro_oleo:["Filtro de óleo","Retém partículas antes que o óleo chegue aos mancais.","Na troca, corte e inspecione o elemento: limalha visível antecipa uma falha interna."],
   bomba_agua:["Bomba d'água","Faz o líquido de arrefecimento circular pelo bloco, cabeçote, resfriador de óleo e radiador.","Gotejamento pelo furo de alívio indica selo mecânico gasto. Programe a troca antes que o vazamento aumente."]
  },
  plan:[
   ["Nível de óleo e de líquido de arrefecimento","10 h / turno","Visual, motor nivelado e frio"],
   ["Indicador de restrição do filtro de ar","10 h / turno","Troque o elemento pelo indicador, não pelo calendário"],
   ["Drenar água do separador de combustível","10 h / turno","Dreno do filtro primário"],
   ["Amostra S·O·S de óleo do motor","250 h","Válvula de amostragem, motor quente"],
   ["Limpeza da colmeia do radiador e do ATAAC","250 h ou menos","Ar comprimido de dentro para fora; antes em galerias com muita poeira"],
   ["Troca de óleo e filtro do motor","500 h (típico)","Pode encurtar ou alongar conforme o S·O·S"],
   ["Filtros de combustível primário e secundário","500 h (típico)","Escorve o sistema sem encher o filtro novo com diesel sujo"],
   ["Folga de válvulas e injetores","Conforme OMM","Motor frio, com ferramenta de giro"],
   ["Líquido de arrefecimento (ELC)","Teste a cada 500 h; troca longa","Concentração e aditivo; troca no prazo do OMM"]
  ],
  fails:[
   ["Superaquecimento","Temperatura alta, alarme, redução de potência","Colmeia obstruída, termostato travado, bomba d'água, nível baixo","Limpeza da colmeia, teste do termostato e da tampa, teste de pressão do sistema"],
   ["Fumaça preta e falta de força","Máquina lenta na rampa","Filtro de ar restrito, vazamento de ar de turbo, injetor","Ler o indicador de restrição, medir a pressão de turbo, ler códigos do ECM"],
   ["Silício alto no S·O·S","Desgaste acelerado de anéis e camisas","Entrada de poeira: duto solto, abraçadeira, vedação do filtro","Inspecionar todo o caminho do ar limpo e vedação do elemento"],
   ["Combustível no óleo","Óleo fino, nível subindo, pressão de óleo baixa","Injetor gotejando ou vedação do injetor","Teste de corte de cilindro e troca do injetor"]
  ],
  pcm:"Use o S·O·S como gatilho de manutenção por condição. Acompanhe a tendência de ferro e cromo (anéis e camisas), silício (poeira), sódio e potássio (líquido de arrefecimento) e fuligem. Um desvio vira uma OS planejada antes da quebra, o que protege a disponibilidade física e alonga o MTBF.",
  quiz:["Por que o comando de válvulas gira a metade da rotação do virabrequim?",["Para reduzir o desgaste dos ressaltos","Porque cada cilindro completa os 4 tempos em duas voltas do virabrequim","Para economizar combustível"],1,"Admissão, compressão, combustão e escape ocupam 720° de virabrequim. Cada válvula abre uma vez nesse período, ou seja, uma volta do comando."]
 },

 transmissao:{
  n:"Conversor de torque e transmissão", tag:"Trem de força", detail:"Vista explodida do conversor e de uma transmissão planetária powershift",
  sum:"O conversor de torque liga o motor à transmissão por meio do óleo, sem contato mecânico. A transmissão planetária powershift troca de marcha sob carga com embreagens hidráulicas e oferece marchas à frente e à ré.",
  how:[
   "<b>Conversor de torque.</b> O impulsor gira com o motor e arremessa óleo contra as pás da turbina, que gira e move a transmissão. Como a ligação é por fluido, a máquina pode parar enfiada na pilha sem o motor morrer.",
   "O <b>estator</b>, entre a turbina e o impulsor, redireciona o óleo que volta da turbina para que ele ajude o impulsor em vez de frear. Isso multiplica o torque quando a turbina está lenta ou parada (estol), situação típica da penetração na pilha.",
   "<b>Conjunto planetário.</b> Solar no centro, satélites presos a um porta-satélites, coroa com dentes internos por fora. As engrenagens nunca desengrenam. Quando uma embreagem trava a coroa, a solar (entrada) faz o porta-satélites (saída) girar mais devagar e com mais torque.",
   "Combinando quais embreagens estão aplicadas em cada conjunto, a transmissão monta as marchas. O módulo eletrônico modula a pressão de cada embreagem para que a troca seja firme e sem tranco."
  ],
  flow:["Volante","Impulsor","Óleo","Turbina","Planetários + embreagens","Transferência","Cardãs","Eixos"],
  formula:"Planetário com coroa travada (entrada na solar, saída no porta-satélites):\ni = 1 + Zcoroa ÷ Zsolar = 1 + 39 ÷ 15 = 3,6 : 1\nO torque na saída é cerca de 3,6 vezes o da entrada, menos as perdas.",
  parts:{
   carcaca_t:["Carcaça","Mantém tudo em banho de óleo. O mesmo óleo lubrifica, resfria e aciona as embreagens.","Respiro entupido pressuriza a carcaça e força os retentores."],
   impulsor:["Impulsor (bomba)","Preso ao volante, gira com o motor e funciona como uma bomba centrífuga de óleo.","Trinca nas pás ou desbalanceamento gera vibração na faixa de rotação do motor."],
   turbina:["Turbina","Recebe o jato de óleo e move o eixo de entrada da transmissão. Gira mais devagar que o impulsor (escorregamento).","Escorregamento alto aquece o óleo. A temperatura do conversor no painel mostra isso."],
   estator:["Estator (reator)","Redireciona o óleo e multiplica o torque. Fica numa roda livre: trava em baixa velocidade e gira livre quando turbina e impulsor se igualam.","Roda livre que não trava tira força na pilha. Roda livre que não solta superaquece o conversor em velocidade."],
   eixo:["Eixo de entrada","Leva o torque da turbina até os conjuntos planetários.","Ruído e vibração junto com a rotação da turbina podem indicar rolamento gasto."],
   solar:["Engrenagem solar","Engrenagem central do conjunto. Neste exemplo é a entrada de força.","Dentes lascados deixam partículas no óleo e na tela magnética."],

   embreagem:["Pacote de embreagem","Discos de fricção alternados com discos de aço. A pressão hidráulica empurra um pistão que aperta o pacote e trava um elemento do planetário. Use o controle Explodir para ver os discos separados.","Patinação e temperatura alta são os sintomas. Material de fricção e cobre no S·O·S indicam desgaste dos discos."],

 eixos:{
  n:"Eixos, comandos finais e freios", tag:"Trem de força", detail:"Vista explodida de um eixo com diferencial, freio SAFR e comando final planetário",
  sum:"Os eixos recebem a força dos cardãs, viram o movimento em 90°, dividem a força entre as rodas e fazem a redução final dentro do cubo. Os freios ficam dentro do eixo, em banho de óleo.",
  how:[
   "O <b>pinhão</b> recebe a força do cardã e engrena na <b>coroa</b>: é a primeira redução, que também vira o giro em 90°.",
   "O <b>diferencial</b>, dentro da caixa da coroa, deixa a roda de fora girar mais rápido que a de dentro numa curva. Sem ele, os pneus arrastariam em toda curva.",
   "O <b>semieixo</b> leva o torque até o <b>comando final planetário</b> no cubo. Lá a solar gira, a coroa interna é fixa e o porta-satélites move a roda. A grande redução acontece perto da roda, então o semieixo trabalha com torque menor e pode ser mais leve.",
   "Os freios <b>SAFR</b> são aplicados por mola e liberados por pressão hidráulica. Se a pressão some (mangueira rompida ou motor desligado), as molas freiam a máquina. É um projeto de falha segura."
  ],
  flow:["Cardã","Pinhão","Coroa","Diferencial","Semieixo","Solar","Satélites","Porta-satélites","Roda"],
  formula:"Redução total do eixo deste modelo:\n(Zcoroa ÷ Zpinhão) × (1 + Zanel ÷ Zsolar)\n= (34 ÷ 9) × (1 + 29 ÷ 11) ≈ 3,8 × 3,6 ≈ 13,7 : 1",
  parts:{
   carcaca_e:["Carcaça do eixo","Suporta o peso da máquina e da carga e guarda o óleo dos engrenamentos e dos freios.","Respiro limpo e nível de óleo correto. Óleo leitoso indica entrada de água."],
   pinhao:["Pinhão","Recebe a força do cardã e engrena na coroa, virando o movimento em 90°.","Folga no rolamento do pinhão aparece como ruído e vazamento no retentor do flange."],
   diferencial:["Coroa e diferencial","A coroa faz a primeira redução. As engrenagens satélites dentro da caixa deixam as rodas girarem em velocidades diferentes nas curvas.","Ruído de uivo que muda com a carga indica desgaste ou ajuste ruim de coroa e pinhão."],
   semieixo:["Semieixo","Leva o torque do diferencial até a solar do comando final.","Quebra por torção costuma vir de golpes de carga: pneu girando em falso que agarra de repente."],
   freio:["Freio SAFR multidisco","Discos que giram com a roda (escuros) alternados com discos fixos (claros), em banho de óleo. Molas aplicam e pressão hidráulica libera.","Teste de freio conforme o procedimento da mina. Freio arrastando aquece o óleo do eixo; meça o desgaste dos discos na reforma."],
   comando_final:["Comando final planetário","Redução final dentro do cubo: solar (do semieixo), satélites e porta-satélites (a roda), com o anel fixo.","Nível e S·O·S do óleo do comando final. Partículas indicam rolamento ou dente em desgaste."],
   cubo:["Cubo da roda","Onde o aro do pneu é fixado. Gira devagar e com torque máximo.","Reaperto das porcas do aro no torque do OMM. A vedação duo-cone entre cubo e carcaça impede a entrada de lama."]

  plan:[

   ["Teste de freio de serviço e de estacionamento","Por turno ou conforme procedimento","Procedimento da mina, em rampa ou com teste de estol"],
   ["Nível de óleo do diferencial e dos comandos finais","250 h","Máquina nivelada, bujão na posição certa"],
   ["Amostra S·O·S dos eixos","250 h ou 500 h","Um ponto de coleta por compartimento"],
   ["Troca de óleo dos eixos","1.000 a 2.000 h (típico)","Inspecione o bujão magnético"],
   ["Desgaste dos discos de freio","Conforme OMM","Medição pela ferramenta de verificação de desgaste"]

   ["Vazamento na vedação duo-cone","Óleo no cubo, lama no óleo","Anel de vedação danificado ou montado errado","Troca do par de anéis e limpeza das faces"],
   ["Ruído na coroa e pinhão","Uivo em aceleração ou desaceleração","Desgaste, folga de rolamento, óleo contaminado","S·O·S, análise de vibração e inspeção do contato dos dentes"]
  ],
  pcm:"Freio é item de segurança: a falha no teste vira parada imediata, não backlog. Já o desgaste dos discos e a tendência do S·O·S permitem programar a reforma do eixo na parada planejada, com o eixo reserva já reformado. Esse conceito de componente reserva rotativo reduz muito o tempo de máquina parada.",

 implemento:{
  n:"Braços e cilindros de levante", tag:"Implemento", detail:"Vista explodida de um cilindro hidráulico de dupla ação",
  sum:"Os braços de levante levam a caçamba. Dois cilindros de levante sobem os braços e um cilindro de basculamento gira a caçamba para carregar e descarregar.",
  how:[
   "Um cilindro de <b>dupla ação</b> tem duas câmaras separadas pelo êmbolo. Óleo sob pressão no lado base empurra o êmbolo e a haste sai. Óleo no lado haste faz a haste recolher.",
   "A força é <b>pressão × área</b>. No lado base, a pressão age sobre o círculo inteiro do êmbolo. No lado haste, a área da haste é descontada. Por isso o cilindro empurra com mais força do que puxa, e recolhe mais rápido do que estende, para a mesma vazão.",
   "A geometria dos braços funciona como alavanca e define a força de desagregação na ponta da caçamba. Pinos e buchas em cada articulação carregam toda essa força, por isso a lubrificação é tão importante.",
   "Na animação, laranja é a câmara pressurizada e azul é a câmara que está devolvendo óleo ao tanque."
  ],
  flow:["Joystick","Válvula de controle","Câmara base ou haste","Êmbolo","Haste","Braço / caçamba"],
  formula:"Exemplo didático (valores ilustrativos):\nDiâmetro do êmbolo 200 mm → A = π × 0,1² = 0,0314 m²\nPressão 25 MPa (250 bar)\nF = p × A = 25.000.000 × 0,0314 ≈ 785 kN (cerca de 80 t-força)",
  parts:{
   camisa:["Camisa (tubo)","Tubo de aço com a parede interna brunida, onde o êmbolo desliza. Tem as portas de entrada e saída de óleo.","Riscos internos deixam o óleo passar de uma câmara para outra e o braço desce sozinho (deriva)."],
   embolo:["Êmbolo com vedações","Divide a camisa nas duas câmaras. Suas vedações impedem a passagem de óleo de um lado para o outro.","Teste de deriva: levante a caçamba carregada, desligue e meça quanto o braço desce no tempo do procedimento."],
   haste:["Haste cromada","Transmite a força ao braço ou à caçamba. O cromo resiste à corrosão e ao desgaste.","Pancadas e riscos na haste cortam a vedação do cabeçote e causam vazamento externo."],
   cabecote_c:["Cabeçote (guia da haste)","Fecha a camisa no lado da haste e guia a haste com buchas.","Folga na bucha guia desalinha a haste e acelera o desgaste da vedação."],
   vedacoes:["Vedação da haste e raspador","A vedação segura a pressão. O raspador limpa a haste quando ela recolhe, para a poeira não entrar.","Raspador danificado em mina contamina todo o sistema hidráulico. É barato e merece troca preventiva."],
   oleo:["Câmaras de óleo","Câmara do lado base (área cheia) e câmara do lado haste (área anular). A mesma pressão gera mais força no lado base.","A limpeza do óleo, medida pelo código ISO 4406, define a vida das vedações."]
  },
  plan:[
   ["Lubrificação de pinos e buchas","Diário (verificar o sistema automático)","Graxa nova visível na borda de cada ponto"],
   ["Vazamento e estado das hastes","10 h / turno","Visual: riscos, pancadas, óleo no raspador"],
   ["Trincas em soldas dos braços","50 h","Visual; líquido penetrante em ponto suspeito"],
   ["Folga de pinos e buchas","250 h","Medição com relógio comparador e registro para tendência"],
   ["Teste de deriva dos cilindros","500 h ou por queixa","Procedimento padrão com caçamba carregada"]
  ],
  fails:[
   ["Braço desce sozinho","Caçamba baixa durante o transporte","Vedação do êmbolo, carretel da válvula, válvula de retenção","Teste de deriva isolando cilindro e válvula"],
   ["Folga em pinos e buchas","Batida no fim de curso, desalinhamento","Falha de lubrificação, graxa contaminada","Corrigir a lubrificação e programar a troca com usinagem (line boring) se preciso"],
   ["Vazamento na haste","Óleo escorrendo pela haste","Vedação ou raspador danificados, haste riscada","Reforma do cilindro em oficina e troca preventiva do raspador"]
  ],
  pcm:"Registre a folga de cada pino em cada medição. Com a tendência em mãos, a troca de pinos e buchas e a usinagem dos olhais entram numa parada planejada, antes de a folga ovalizar o furo e transformar um serviço de horas numa recuperação estrutural de dias.",
  quiz:["Com a mesma pressão, por que o cilindro empurra com mais força do que puxa?",["Porque o óleo é mais denso no lado base","Porque no lado base a pressão age sobre a área inteira do êmbolo, e no lado haste a área da haste é descontada","Porque a válvula manda mais pressão para estender"],1,"F = p × A. A área útil no lado haste é a área do êmbolo menos a área da haste."]
 },

 cacamba:{
  n:"Caçamba e GET", tag:"Implemento", detail:"Vista explodida da caçamba com lâmina, dentes e chapas de desgaste",
  sum:"A caçamba recolhe, transporta e descarrega o minério. A carga útil nominal é de 15 toneladas, e o volume da caçamba (de cerca de 5,7 a 8,6 m³ na R1700) é escolhido conforme a densidade do material.",
  how:[
   "LHD significa <b>Load, Haul, Dump</b>: carregar, transportar e descarregar. A caçamba penetra na pilha com a lâmina na horizontal, recolhe para trás para segurar a carga e viaja baixa para manter o centro de gravidade baixo.",
   "A <b>carga útil</b> é limitada em peso. Por isso o volume certo depende da densidade do material solto. Caçamba grande demais para um minério pesado sobrecarrega eixos, pneus e articulação.",
   "<b>GET</b> (Ground Engaging Tools) são as peças de desgaste que encostam no material: dentes ou protetores, lâmina, cantoneiras. Elas existem para se gastar no lugar da estrutura da caçamba."
  ],
  formula:"Volume adequado ≈ carga útil ÷ densidade do material solto\nEx.: 15 t ÷ 2,2 t/m³ ≈ 6,8 m³\nMinério mais leve (1,8 t/m³) → caçamba maior ≈ 8,3 m³",
  parts:{
   concha:["Concha","Fundo, costas e laterais. Define o volume e recebe a carga.","Trincas nos cantos e na ligação com os olhais aparecem por fadiga. Inspecione nas trocas de GET."],
   lamina:["Lâmina de corte","Aresta frontal de aço de alta dureza que penetra na pilha.","Meça o desgaste e troque antes de expor a chapa do fundo."],
   dentes:["Dentes e protetores (GET)","Pontas substituíveis de aço resistente à abrasão. Concentram a força de penetração.","Um dente perdido pode travar o britador ou rasgar uma correia. Inspeção a cada turno."],
   chapas:["Chapas de desgaste","Placas sob o fundo que se gastam no lugar da estrutura.","Meça a espessura restante e troque com folga antes de atingir a chapa base."],
   cantoneiras:["Cantoneiras laterais","Protegem as bordas laterais quando a caçamba raspa as paredes da galeria.","Desgaste assimétrico mostra que o operador raspa sempre o mesmo lado."],
   olhais:["Olhais de articulação","Pontos onde os braços e o cilindro de basculamento se prendem à caçamba com pinos e buchas.","Folga no pino da caçamba: meça e registre para tendência."]
  },
  plan:[
   ["GET: dentes, protetores, travas","Por turno","Visual e martelo de teste nas travas"],
   ["Desgaste da lâmina e chapas","50 h","Medição de espessura com gabarito"],
   ["Trincas na concha","250 h ou na troca de GET","Visual, líquido penetrante em ponto suspeito"],
   ["Troca de GET","Pela medição","Planejar com o kit pronto e a caçamba limpa"]
  ],
  fails:[
   ["Perda de dente","Dente ausente na inspeção, alarme no britador","Trava gasta, adaptador desgastado","Rastrear o dente e trocar o sistema de travamento"],
   ["Desgaste prematuro","Vida do GET menor que a média","Material mais abrasivo, técnica de carga, piso irregular","Revisar o tipo de GET e treinar a operação"],
   ["Trinca estrutural","Trinca visível no canto ou olhal","Fadiga, sobrecarga, solda de reparo malfeita","Reparo com procedimento de solda qualificado"]
  ],
  pcm:"Faça a curva de desgaste do GET em horas de operação. Com ela você prevê em que parada programada a troca cabe, deixa o kit separado e evita que uma peça de poucos reais cause uma parada longa no britador.",
  quiz:["Uma frota troca para um minério mais denso. O que acontece se a caçamba continuar a mesma?",["Nada, a carga é medida em volume","A máquina passa a carregar mais peso do que a carga útil nominal","A caçamba enche menos"],1,"Mesmo volume com material mais denso significa mais toneladas por passe, sobrecarregando eixos, pneus, articulação e o trem de força."]
 },

 hidraulico:{
  n:"Sistema hidráulico", tag:"Sistemas", detail:"Vista explodida de uma bomba de engrenagens, que ilustra o deslocamento positivo",
  sum:"Bombas acionadas pelo motor geram a vazão de óleo que move os cilindros de levante, basculamento e direção. Válvulas comandadas pelo operador direcionam o óleo, e a direção tem prioridade.",
  how:[
   "A bomba <b>não cria pressão, cria vazão</b>. A pressão aparece quando o óleo encontra resistência, como o peso da carga no cilindro. A válvula de alívio limita a pressão máxima.",
   "Numa bomba de engrenagens, o óleo fica preso nos vãos entre os dentes e a carcaça e é levado da sucção para a saída. No centro, onde os dentes se encontram, ele não consegue voltar. Isso é <b>deslocamento positivo</b>: cada volta empurra um volume fixo de óleo.",
   "A <b>válvula de controle principal</b> tem carretéis que, movidos pelos joysticks, ligam a bomba a uma câmara do cilindro e a outra câmara ao tanque.",
   "O óleo volta pelo radiador de óleo e pelo filtro de retorno antes de chegar ao tanque. Limpeza do óleo é a maior influência na vida de bombas, válvulas e vedações. As bombas reais da sua frota podem ser de outro tipo (pistões, por exemplo); o princípio de deslocamento positivo é o mesmo."
  ],
  flow:["Tanque","Sucção","Bomba","Válvula de controle","Cilindros","Radiador de óleo","Filtro de retorno","Tanque"],
  formula:"Vazão = deslocamento × rotação × eficiência volumétrica\nEx.: 160 cm³/volta × 1.800 rpm × 0,95 ≈ 274 L/min\nEficiência caindo = desgaste interno = ciclo lento",
  parts:{
   carcaca_b:["Carcaça da bomba","Envolve as engrenagens com folga mínima. O óleo só passa pelos vãos entre os dentes e a parede.","Marcas de raspagem na carcaça indicam rolamento gasto ou contaminação."],
   eng_motora:["Engrenagem motora","Acionada pelo motor através da caixa de tomada de força. Arrasta a engrenagem movida.","Dentes gastos aumentam o vazamento interno e reduzem a vazão."],
   eng_movida:["Engrenagem movida","Gira em sentido contrário. No centro, onde os dentes engrenam, o óleo é expulso para a saída.","Mesmo desgaste da motora. As duas são trocadas juntas."],
   placas:["Placas de desgaste laterais","Vedam as faces das engrenagens.","Desgaste aqui aumenta o vazamento interno e o ciclo fica lento."],
   portas:["Sucção e pressão","Entrada larga (azul) para o óleo entrar devagar e sem cavitar, saída menor (laranja) com alta pressão.","Ruído de cascalho é cavitação: filtro de sucção obstruído, óleo frio e viscoso ou nível baixo."]
  },
  plan:[
   ["Nível do tanque hidráulico","10 h / turno","Visor, braços abaixados"],
   ["Mangueiras e conexões","10 h / turno","Atrito, bolhas, vazamentos. Nunca procure vazamento com a mão"],
   ["Amostra S·O·S e contagem de partículas","250 h","Código ISO 4406"],
   ["Filtros de retorno e piloto","500 h (típico) ou por indicador","Corte e inspeção do elemento"],
   ["Troca de óleo hidráulico","2.000 a 4.000 h (típico)","Pode alongar com S·O·S e filtragem boa"],
   ["Pressões de alívio e tempos de ciclo","Conforme OMM","Manômetro nos pontos de teste e cronômetro"]
  ],
  fails:[
   ["Ciclo lento","Braço demora a subir","Bomba gasta, alívio desregulado, filtro de sucção obstruído, ar no óleo","Medir vazão e pressão, cronometrar ciclos"],
   ["Superaquecimento do óleo","Alarme de temperatura","Radiador sujo, alívio abrindo muito tempo, vazamento interno","Limpar o radiador, conferir o alívio e a operação"],
   ["Mangueira rompida","Vazamento súbito, perda de função","Atrito, idade, montagem torcida","Isolar a máquina. Óleo em alta pressão perfura a pele: é emergência médica"]
  ],
  pcm:"Trate mangueiras como componente com vida útil. Etiquete cada mangueira com a data de montagem, mantenha estoque das críticas montadas e faça a troca preventiva por idade nas paradas. Mangueira estourada na galeria costuma custar horas de máquina parada e um risco de incêndio.",
  quiz:["O braço sobe devagar mesmo com o motor acelerado. Qual é a suspeita mais provável?",["Pressão do pneu baixa","Vazamento interno na bomba ou alívio regulado abaixo do especificado","Óleo do motor vencido"],1,"Menos vazão útil ou óleo escapando pelo alívio significa menos volume por segundo nos cilindros: ciclo lento."]
 },

 chassi:{
  n:"Chassi, articulação e direção", tag:"Estrutura", detail:"Vista explodida da articulação central com os cilindros de direção",
  sum:"A máquina é dividida em dois chassis ligados por uma articulação central. A direção funciona dobrando a máquina no meio, com dois cilindros.",
  how:[
   "Dois <b>pinos verticais</b> (superior e inferior), no mesmo eixo, ligam o chassi dianteiro ao traseiro. Toda a força da caçamba passa por eles.",
   "Os <b>cilindros de direção</b> trabalham em par: um estende enquanto o outro recolhe e o chassi dianteiro gira em torno dos pinos, cerca de 40° para cada lado.",
   "Em uma máquina articulada, as rodas traseiras seguem a trilha das dianteiras. Isso permite manobrar em galerias estreitas e fazer curvas fechadas sem raspar as paredes.",
   "O eixo traseiro oscila em relação ao chassi para manter as quatro rodas no piso irregular da mina."
  ],
  formula:"Raio de curva menor + traseira seguindo a dianteira\n→ menos manobras por ciclo\n→ mais ciclos por hora (produtividade)",
  parts:{
   quadro_tras:["Chassi traseiro","Leva motor, transmissão, cabine e tanques. Os garfos superior e inferior recebem os pinos da articulação.","Trincas em soldas perto dos garfos: inspeção visual e ensaio não destrutivo nas reformas."],

/* ---------- helpers de geometria ---------- */
function mat(c,o={}){ const m=new THREE.MeshStandardMaterial(Object.assign({color:c, roughness:.55, metalness:.3}, o)); m.color.convertSRGBToLinear(); return m; }
function glass(c,op=.18){ const m = mat(c,{transparent:true, opacity:op, depthWrite:false, roughness:.25, metalness:.1, side:THREE.DoubleSide}); m.userData.glass = true; return m; }
function mesh(g,m){ const o = new THREE.Mesh(g,m); if (m.userData.glass) o.userData.glass = true; return o; }
function box(w,h,d,m){ return mesh(new THREE.BoxGeometry(w,h,d), m); }
function cyl(r1,r2,h,m,seg=28,open=false){ return mesh(new THREE.CylinderGeometry(r1,r2,h,seg,1,open), m); }
function cylX(r,h,m,seg=28,open=false){ const o = cyl(r,r,h,m,seg,open); o.geometry.rotateZ(Math.PI/2); return o; }
function cylZ(r,h,m,seg=28,open=false){ const o = cyl(r,r,h,m,seg,open); o.geometry.rotateX(Math.PI/2); return o; }
function at(o,x,y,z){ o.position.set(x,y,z); return o; }
const UP = V3(0,1,0);
function between(o,a,b){ const d = V3().subVectors(b,a), L = d.length(); o.position.copy(a).addScaledVector(d,.5); o.quaternion.setFromUnitVectors(UP, d.normalize()); o.scale.set(1,L,1); }
function teeth(p,r0,r1,n){ for (let i=0;i<n;i++){ const a=i/n*TAU, d=TAU/n;
  [[r0,a],[r1,a+d*.2],[r1,a+d*.5],[r0,a+d*.7]].forEach(([r,an],j)=>{ const x=r*Math.cos(an), y=r*Math.sin(an); (i===0&&j===0)?p.moveTo(x,y):p.lineTo(x,y); }); }
  const x=r0, y=0; p.lineTo(x,y); }
function gearGeo(r0,r1,n,depth,hole=0){ const s=new THREE.Shape(); teeth(s,r0,r1,n);
  if (hole){ const h=new THREE.Path(); h.absarc(0,0,hole,0,TAU,true); s.holes.push(h); }
  const g=new THREE.ExtrudeGeometry(s,{depth,bevelEnabled:false,curveSegments:6}); g.translate(0,0,-depth/2); return g; }
function ringGeo(rOut,r0,r1,n,depth){ const s=new THREE.Shape(); s.absarc(0,0,rOut,0,TAU,false);
  const h=new THREE.Path(); teeth(h,r0,r1,n); s.holes.push(h);
  const g=new THREE.ExtrudeGeometry(s,{depth,bevelEnabled:false,curveSegments:48}); g.translate(0,0,-depth/2); return g; }
// eixo: "x" ou "z" (padrão da extrusão é z)
function gear(r0,r1,n,depth,m,axis="z",hole=0){ const g=gearGeo(r0,r1,n,depth,hole); if(axis==="x") g.rotateY(Math.PI/2); return mesh(g,m); }
function ring(rOut,r0,r1,n,depth,m,axis="z"){ const g=ringGeo(rOut,r0,r1,n,depth); if(axis==="x") g.rotateY(Math.PI/2); return mesh(g,m); }
function makeCyl(rb,rr,cb,cr){ const b=mesh(new THREE.CylinderGeometry(rb,rb,1,18), mat(cb,{metalness:.4})); const r=mesh(new THREE.CylinderGeometry(rr,rr,1,14), mat(cr,{metalness:.9,roughness:.18})); return {b,r,Lb:0,Lr:0}; }
function setCyl(c,A,B){ const d=V3().subVectors(B,A); const L=d.length(); d.normalize(); const q=new THREE.Quaternion().setFromUnitVectors(UP,d);
  const Lb=Math.min(c.Lb,L), Lr=Math.min(c.Lr,L);
  c.b.position.copy(A).addScaledVector(d,Lb/2); c.b.quaternion.copy(q); c.b.scale.set(1,Lb,1);
  c.r.position.copy(B).addScaledVector(d,-Lr/2); c.r.quaternion.copy(q); c.r.scale.set(1,Lr,1); }

const CYCLE=[[0,0,0,0,"Aproximação da pilha"],[2,0,0,0,"Penetração na pilha com a lâmina na horizontal"],[3.5,.1,.6,0,"Recolhe a caçamba para segurar a carga"],
  [5,.1,.6,0,"Transporte com a caçamba baixa"],[6.5,.1,.6,.6,"Curva: a máquina dobra na articulação central"],[8,.1,.6,0,"Chegada ao ponto de descarga"],
  [9.5,.85,.6,0,"Levante dos braços"],[11,.85,-.85,0,"Basculamento: descarga do material"],[12.5,.85,-.85,0,"Retorno: abaixa e nivela a caçamba"],[14,0,0,0,""]];
function cyclePose(t){ t%=14; let i=0; while(i<CYCLE.length-2 && t>=CYCLE[i+1][0]) i++;
  const a=CYCLE[i], b=CYCLE[i+1]; let u=(t-a[0])/(b[0]-a[0]); u=u*u*(3-2*u);
  const L=(k)=>a[k]+(b[k]-a[k])*u;
  const moving = t<2 || (t>=5 && t<8) || t>=12.5;
  return {arm:L(1),bw:L(2),steer:L(3),label:a[4],moving, dir: t>=12.5?-1:1}; }

/* =========================================================
   CONTROLE DE CÂMERA (órbita própria)
   ========================================================= */
const orbit={t:V3(-.5,1,0), r:13.5, th:.75, ph:1.12, gt:V3(-.5,1,0), gr:13.5, gth:.75, gph:1.12};
function camTo(t,r,th,ph){ orbit.gt.set(...t); orbit.gr=r; if(th!==undefined) orbit.gth=th; if(ph!==undefined) orbit.gph=ph; }
const ptrs=new Map(); let dragMoved=0, downT=0, pinch0=0;
const cv = renderer ? renderer.domElement : null;
if (cv){
  cv.addEventListener("pointerdown",e=>{ cv.setPointerCapture(e.pointerId); ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY}); dragMoved=0; downT=performance.now();
    if (ptrs.size===2){ const [a,b]=[...ptrs.values()]; pinch0=Math.hypot(a.x-b.x,a.y-b.y); } });
  cv.addEventListener("pointermove",e=>{ const p=ptrs.get(e.pointerId);
    if (!p){ hover(e); return; }
    const dx=e.clientX-p.x, dy=e.clientY-p.y; dragMoved+=Math.abs(dx)+Math.abs(dy); p.x=e.clientX; p.y=e.clientY;
    if (ptrs.size===1){ orbit.gth-=dx*.008; orbit.gph=Math.min(1.52,Math.max(.12,orbit.gph-dy*.008)); tip.hidden=true; }
    else if (ptrs.size===2){ const [a,b]=[...ptrs.values()]; const dd=Math.hypot(a.x-b.x,a.y-b.y); if(pinch0){ orbit.gr=Math.min(30,Math.max(2,orbit.gr*pinch0/dd)); } pinch0=dd; } });
  const up=e=>{ const was=ptrs.has(e.pointerId); ptrs.delete(e.pointerId); if (ptrs.size<2) pinch0=0;
    if (was && dragMoved<7 && performance.now()-downT<600) click(e); };
  cv.addEventListener("pointerup",up); cv.addEventListener("pointercancel",e=>{ptrs.delete(e.pointerId);});
  cv.addEventListener("pointerleave",()=>{ if(!ptrs.size){ tip.hidden=true; setHover(null); } });
  cv.addEventListener("wheel",e=>{ e.preventDefault(); orbit.gr=Math.min(30,Math.max(2,orbit.gr*(1+Math.sign(e.deltaY)*.08))); },{passive:false});
}

const S={mode:"main", sys:null, part:null, tab:"how", explode:0, gExplode:0, playing:true, cycle:false, xray:false, ct:0, det:null, hover:null, quiz:{}};
const cache={};
const ray=new THREE.Raycaster(), ndc=new THREE.Vector2();
function pick(e){ if(!cv) return null; const r=cv.getBoundingClientRect(); ndc.set((e.clientX-r.left)/r.width*2-1, -(e.clientY-r.top)/r.height*2+1); ray.setFromCamera(ndc,camera);
  const root = S.mode==="main" ? loader.root : S.det.group;
  const hits = ray.intersectObject(root,true).filter(h=>h.object.visible && h.object.material && !(S.mode==="main" && S.xray && h.object.userData.shell));
  let best = hits.find(h=>!h.object.userData.glass) || hits[0]; if(!best) return null;
  if (S.mode==="main") return best.object.userData.sys ? {sys:best.object.userData.sys} : null;
  let o=best.object; while(o && !o.userData.part) o=o.parent; return o ? {part:o.userData.part} : null; }
function meshesOf(h){ if(!h) return [];
  if (h.sys) return sysMeshes[h.sys];
  const out=[]; S.det.parts.filter(p=>p.userData.part===h.part).forEach(p=>p.traverse(m=>{ if(m.isMesh) out.push(m); })); return out; }
let lit=[];
function relight(){ lit.forEach(m=>m.material.emissive && m.material.emissive.setHex(m.userData.e0||0)); lit=[];
  const apply=(arr,hex)=>arr.forEach(m=>{ if(!m.material.emissive) return; if(m.userData.e0===undefined) m.userData.e0=m.material.emissive.getHex(); m.material.emissive.setHex(hex); lit.push(m); });
  if (S.mode==="detail" && S.part) apply(meshesOf({part:S.part}),0x5c4200);
  if (S.mode==="main" && S.sys) apply(meshesOf({sys:S.sys}),0x4a3500);
  if (S.hover) apply(meshesOf(S.hover),0x2e2510); }
function setHover(h){ const k=h?(h.sys||h.part):null, k0=S.hover?(S.hover.sys||S.hover.part):null; if(k===k0) return; S.hover=h; relight(); if(cv) cv.classList.toggle("pointing",!!h); }
function hover(e){ const h=pick(e); setHover(h);
  if (h){ const r=viewer.getBoundingClientRect(); tip.hidden=false; tip.style.left=(e.clientX-r.left)+"px"; tip.style.top=(e.clientY-r.top)+"px";
    tip.textContent = h.sys ? SYS[h.sys].n : SYS[S.sys].parts[h.part][0]; } else tip.hidden=true; }
function click(e){ const h=pick(e); if(!h) return;
  if (h.sys) openSys(h.sys); else selectPart(h.part); }

function openSys(id){ S.sys=id; S.part=null; S.tab="how";
  const s=SYS[id];
  if (s.detail && DET[id]){ S.mode="detail";
    if(!cache[id]){ cache[id]=DET[id](); scene.add(cache[id].group); }
    Object.values(cache).forEach(d=>d.group.visible=false);
    S.det=cache[id]; S.det.group.visible=true; loader.root.visible=false; floor.position.y=S.det.floorY;
    S.explode=0; S.gExplode=S.det.ex0??.55; S.playing=true; camTo(S.det.cam.t,S.det.cam.r,.85,1.15);
  } else { S.mode="main"; S.det=null; loader.root.visible=true; floor.position.y=0;
    const b=new THREE.Box3(); sysMeshes[id].forEach(m=>b.expandByObject(m)); const c=b.getCenter(V3()); camTo([c.x,c.y,c.z],6.5); }
  setHover(null); relight(); renderAll(); }
function home(){ S.mode="main"; S.sys=null; S.part=null; S.det=null; Object.values(cache).forEach(d=>d.group.visible=false);
  loader.root.visible=true; floor.position.y=0; camTo([-.5,1,0],13.5,.75,1.12); setLive(""); relight(); renderAll(); }
function selectPart(p){ S.part = S.part===p ? null : p; relight(); renderPanel(); }

function resize(){ if(!renderer) return; const w=viewer.clientWidth, h=viewer.clientHeight; renderer.setSize(w,h,false); camera.aspect=w/Math.max(1,h); camera.updateProjectionMatrix(); }
new ResizeObserver(resize).observe(viewer); resize();
const clock=new THREE.Clock(); let lastCycleLabel="";
function frame(){ requestAnimationFrame(frame); const dt=Math.min(clock.getDelta(),.05);
  const f=1-Math.pow(.0015,dt);
  orbit.t.lerp(orbit.gt,f); orbit.r+= (orbit.gr-orbit.r)*f; orbit.th+=(orbit.gth-orbit.th)*f; orbit.ph+=(orbit.gph-orbit.ph)*f;
  camera.position.setFromSphericalCoords(orbit.r,orbit.ph,orbit.th).add(orbit.t); camera.lookAt(orbit.t);
  if (S.mode==="main"){
    if (S.cycle){ S.ct+=dt; const p=cyclePose(S.ct); setPose(p.arm,p.bw,p.steer);
      if (p.moving) loader.wheels.forEach(w=>w.rotation.z-=dt*1.6*p.dir);
      const lab=p.label||lastCycleLabel; setLive(`<div class="box">Ciclo LHD · <span class="k">${lab}</span></div>`); if(p.label) lastCycleLabel=p.label; }
  } else if (S.det){
    S.explode += (S.gExplode-S.explode)*f;
    S.det.parts.forEach(p=>p.position.copy(p.userData.base).addScaledVector(p.userData.ex,S.explode).add(p.userData.anim));
    if (S.playing) S.det.update(dt,S.explode);
    const h=S.det.live(); if (h) setLive(h);
  }
  if (renderer) renderer.render(scene,camera);
}
renderAll(); frame();
</script>
